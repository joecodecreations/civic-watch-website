name: Validate website
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate pages, links and assets
        run: python3 scripts/validate.py
      - name: Check JavaScript syntax
        run: node --check js/site.js
